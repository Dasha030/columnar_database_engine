name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests + JaCoCo coverage gate (>= 90% lines/branches)
        run: mvn -B verify -Pgate
      - name: Mutation testing (PITest, threshold 80%)
        run: mvn -B test-compile org.pitest:pitest-maven:mutationCoverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            target/site/jacoco
            target/pit-reports
